- name: test loops
  hosts: local
  connection: local
  vars:
    topics: ['mongodb', 'redis', 'mysql', 'rabbitmq']
  tasks:
  - name: print list
    debug:
      msg: "{{item}}" # item is a reserved keyword
    loop: "{{topics}}"

  - name: print list
    debug:
      msg: "{{item}}"
    loop:
    - mongodb
    - redis
    - mysql
    - rabbitmq