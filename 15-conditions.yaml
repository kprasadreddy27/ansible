- name: Print operating system
  hosts: local
  connection: local
  tasks:
  - name: Check os is redhat
    debug:
      msg: Os is {{ansible_facts.os_family}}
    when: ansible_facts.os_family == "RedHat"

  - name: Check os is Ubuntu
    debug:
      msg: Os is {{ansible_facts.os_family}}
    when: ansible_facts.os_family == "Debian"

  - name: install nginx in redhat
    dnf:
      name: nginx
      state: present
    when: ansible_facts.os_family == "RedHat"

  - name: install nginx in Ubuntu
    apt: 
      name: nginx
      state: present
    when: ansible_facts.os_family == "Debian"