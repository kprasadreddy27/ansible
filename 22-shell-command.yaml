- name: shell vs command
  hosts: local
  connection: local
  tasks:
  - name: use filters
    # command: cat /etc/passwd | grep prasad
    shell: cat /etc/passwd | grep prasad
    register: cmd_output

  - name: print cmd cmd_output
    debug:
      msg: "{{cmd_output}}"

  - name: redirect
    command: ls -la > /tmp/files.txt
    register: files_output

  - name: print files output
    debug:
      msg: "{{files_output}}"