- name: install some package and uninstall some packages
  hosts: local
  become: yes
  connection: local
  # vars:
  #   packages: [
  #     {name:'nginx', state:'present'},
  #     {name:'mysql', state:'absent'}
  #   ]
  vars:
    packages:
    - {name: 'htop', state: 'absent'}
    - {name: 'net-tools', state: 'present'}
  tasks:
  # - name: install and uninstall
  #   package:
  #     name: "{{item.name}}"
  #     state: "{{item.state}}"
  #   loop: "{{packages}}"

  - name: another way providing list to install and uninstall
    package:
      name: "{{item.name}}"
      state: "{{item.state}}"
    loop: "{{packages}}"