- name: create user
  hosts: local
  become: yes
  connection: local
  tasks:
  - name: add user
    command: id prasad
    register: user_output
    ignore_errors: true

  - name: print user user_output
    debug:
      msg: "{{user_output}}"

  - name: create user
    command: useradd prasad
    when: user_output.rc != 0