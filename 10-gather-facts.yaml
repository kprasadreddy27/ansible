- name: print facts
  hosts: local
  connection: local
  tasks:
  - name: print environment variable (ansible_facts)
    debug:
      msg: "{{ansible_facts}}"

  - name: print specific value from ansible_facts
    debug:
      msg: |
        os_family: {{ansible_facts['os_family']}}
        private_id: {{ansible_facts.default_ipv4.address}}
        private_id: {{ansible_facts['default_ipv4']['address']}}