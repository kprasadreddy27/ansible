- name: test filters
  hosts: local
  connection: local
  vars:
    name: "prasad reddy"
  tasks:
  - name: print default name if name not present
    debug:
      msg: "{{name | default('prasad')}}"
  - name: print default name if name not present
    debug:
      msg: "{{name | split(' ')}}"
    reserve: name_list

  - name: list to string
    debug:
      msg: "{{name_list | join(',')}}"

