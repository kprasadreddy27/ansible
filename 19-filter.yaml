- name: test filters
  hosts: local
  connection: local
  vars:
    name: "prasad reddy"
  tasks:
  - name: print default name if name not present
    debug:
      msg: "{{name | default('prasad')}}"
  - name: print default name if name not present
    debug:
      msg: "{{name | split(' ')}}"
    
  - name: list to string
    vars:
      name_list:
      - prasad
      - reddy
    debug:
      msg: "{{name_list | join(',')}}"

  - name: type convertion
    vars:
      marks: "10"
    debug:
      msg: "student marks {{marks}}"
      when: {{marks}} == 10

